services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"            # 1. Port du backend sur l'hôte
    restart: unless-stopped

  frontend:                    # 2 espaces, aligné avec backend
    build:
      context: ./frontend      # 2. Dossier du frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"              # 3. Port du frontend sur l'hôte
    depends_on:
          backend:
            condition: service_healthy              # 4. Service à démarrer avant le frontend
    restart: unless-stopped



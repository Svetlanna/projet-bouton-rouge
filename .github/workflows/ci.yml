name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 0. SÉCURITÉ : SECRETS =================
  secrets:
    name: Recherche de secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer tout l'historique Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lancer Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo -v
  #1. CI : AUDIT + TESTS =================
  backend:
    name: Backend (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: npm audit du backend
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit du frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires et d'intégration (Jest)
        run: npm test

      - name: Démarrer le serveur en arrière-plan
        run: node server.js &

      - name: Test smoke sur le vrai serveur
        run: npm run test:smoke


  # CD IMAGES (avec scan Trivy) =================
  images:
    name: Construire, scanner (Trivy) et publier les images
    runs-on: ubuntu-latest
    needs: [secrets, backend]
    if: github.event_name == 'push'
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- BACKEND : construire -> scanner -> envoyer ----------
      - name: Construire l'image backend (sans l'envoyer)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: bouton-rouge-backend:scan

      - name: Trivy sur l'image backend
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            bouton-rouge-backend:scan

      - name: Construire et envoyer l'image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bouton-rouge-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bouton-rouge-backend:${{ github.sha }}

      # ---------- FRONTEND : construire -> scanner -> envoyer ----------
      - name: Construire l'image frontend (sans l'envoyer)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: bouton-rouge-frontend:scan

      - name: Trivy sur l'image frontend
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            bouton-rouge-frontend:scan

      - name: Construire et envoyer l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bouton-rouge-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bouton-rouge-frontend:${{ github.sha }}
  #  CD DÉPLOIEMENT SUR LA VM (runner auto-hébergé) =================
  deploy:
    name: Déployer sur la VM (runner auto-hébergé)
    runs-on: [self-hosted, svetlana]     # tourne SUR la VM, sur le runner étiqueté "svetlana"
    needs: images
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Lancer la nouvelle version
        run: |
          mkdir -p ~/bouton-rouge-svetlana
          cp compose.prod.yaml ~/bouton-rouge-svetlana/
          cd ~/bouton-rouge-svetlana
          docker compose -f compose.prod.yaml pull
          docker compose -f compose.prod.yaml up -d --wait --wait-timeout 90
          docker image prune -f
          docker compose -f compose.prod.yaml ps

      - name: Vérifier l'application depuis la VM
        run: |
          curl -sf http://localhost:4203/ > /dev/null
          curl -sf http://localhost:4203/api/health
          echo ""
          echo "Application OK"

  # SÉCURITÉ : SCAN DU SITE EN LIGNE =================
  zap:
    name: Scan de sécurité du site (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: deploy                        # seulement après le déploiement
    steps:
      - name: Préparer le dossier du rapport
        run: mkdir -p zap && chmod 777 zap

      - name: Lancer ZAP baseline (scan passif)
        run: |
          docker run --rm -v "$PWD/zap:/zap/wrk/:rw" zaproxy/zap-stable \
            zap-baseline.py -t http://${{ secrets.VM_HOST }}:4203 -r zap-rapport.html -I

      - name: Publier le rapport ZAP
        if: always()                     # même si le scan échoue, on garde le rapport
        uses: actions/upload-artifact@v4
        with:
          name: rapport-zap
          path: zap/zap-rapport.html
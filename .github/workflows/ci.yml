name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 0. SÉCURITÉ : SECRETS =================
  secrets:
    name: Recherche de secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer tout l'historique Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lancer Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo -v
  #1. CI : AUDIT + TESTS =================
  backend:
    name: Backend (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: npm audit du backend
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit du frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires et d'intégration (Jest)
        run: npm test

      - name: Démarrer le serveur en arrière-plan
        run: node server.js &

      - name: Test smoke sur le vrai serveur
        run: npm run test:smoke

  # CD IMAGES =================
  images:
    name: Construire et publier les images
    runs-on: ubuntu-latest
    needs: [secrets, backend]
    if: github.event_name == 'push'
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et envoyer l'image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bouton-rouge-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bouton-rouge-backend:${{ github.sha }}

      - name: Construire et envoyer l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bouton-rouge-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bouton-rouge-frontend:${{ github.sha }}

  #  CD DÉPLOIEMENT SUR LA VM =================
  deploy:
    name: Déployer sur la VM
    runs-on: ubuntu-latest
    needs: images
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Copier compose.prod.yaml sur la VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          source: compose.prod.yaml
          target: ~/bouton-rouge-svetlana

      - name: Lancer la nouvelle version sur la VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd ~/bouton-rouge-svetlana
            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d --wait --wait-timeout 90
            docker image prune -f
            docker compose -f compose.prod.yaml ps

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test smoke sur la VM (en ligne)
        working-directory: backend
        env:
          BASE_URL: http://${{ secrets.VM_HOST }}:4203/api
        run: npm run test:smoke
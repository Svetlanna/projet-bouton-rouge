name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  #backend ----------
  backend:
    name: Backend (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm                       # garde les paquets en cache pour aller plus vite
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Démarrer le serveur en arrière-plan
        run: |
          node server.js &
          for i in $(seq 1 20); do         
            curl -s -o /dev/null http://localhost:3000 && exit 0
            sleep 1
          done
          echo "Le serveur n'a pas démarré" && exit 1

      - name: Tester /login avec les bons identifiants
        run: |
          curl -sf -X POST http://localhost:3000/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"docker"}' | grep '"success":true'
          # grep échoue (et donc l'étape aussi) si la réponse ne contient pas "success":true

      - name: Tester /login avec de mauvais identifiants (401 attendu)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/login \
            -H "Content-Type: application/json" \
            -d '{"username":"x","password":"y"}')
          echo "Code reçu : $code"
          test "$code" = "401"


server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Ne pas afficher la version de Nginx (alerte "Server Leaks Version") ----
    server_tokens off;

    # ---- En-têtes de sécurité, ajoutés à TOUTES les réponses ----

    # Anti-clickjacking : interdit d'afficher le site dans un cadre (iframe) d'un autre site
    add_header X-Frame-Options "DENY" always;

    # Interdit au navigateur de "deviner" le type d'un fichier
    add_header X-Content-Type-Options "nosniff" always;

    # Le site n'a besoin ni de caméra, ni de micro, ni de position : on les interdit
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Isole le site des autres sites (protection contre les attaques de type Spectre)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # CSP : la liste de ce que le navigateur a le droit de charger
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}